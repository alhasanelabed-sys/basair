name: basair
description: بصائر — أطلس قرآني تفاعلي بحسابات قابلة للتحقق.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.10.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  cross_file: ^0.3.4+2
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/web/index.html
    - assets/web/icon.svg
    - assets/web/fonts/AmiriQuran-Regular.ttf
    - assets/web/fonts/NotoSansArabic.ttf
    - assets/web/fonts/AmiriQuran-OFL.txt
    - assets/web/fonts/NotoSansArabic-OFL.txt
    - assets/web/data/TANZIL-LICENSE.txt
